checkpoint_path: nextrec_logs/ctcvr_task

model_config: model_configs/mmoe.yaml

evaluate:
  name: evaluate_session                     # Name for this evaluation run (used in logs and output files)
  data_path: ../dataset/ctcvr_task.csv
  source_data_format: csv                 
  group_id: user_id
  group_by: custom_column_name              # Column name to group by for evaluation (e.g., user_id, scenario_id)

  target:
    - click
    - conversion

  device: cpu
  streaming: false

  metrics:
    - auc
    - ks
    - precision
    - recall

  confusion_matrix:
    enable: true
    thresholds: [0.5, 0.9]          # Thresholds for binary classification confusion matrix


