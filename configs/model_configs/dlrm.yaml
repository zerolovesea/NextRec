# Reference:
# - Deep Learning Recommendation Model for Personalization and Recommendation Systems

model: dlrm

params:
  bottom_mlp_params:
    hidden_dims: [128, 64]
    activation: relu
    dropout: 0.0
  top_mlp_params:
    hidden_dims: [256, 128]
    activation: relu
    dropout: 0.2

  embedding_l1_reg: 0.0
  embedding_l2_reg: 0.0
  dense_l1_reg: 0.0
  dense_l2_reg: 0.0