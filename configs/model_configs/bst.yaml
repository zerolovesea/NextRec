# Reference:
# - Behavior Sequence Transformer for E-commerce Recommendation in Alibaba

model: bst

params:
  behavior_feature_name: hist_item_ids
  candidate_feature_name: item_id
  num_heads: 8
  num_layers: 1
  dropout: 0.2
  mlp_params:
    hidden_dims: [256, 128]
    activation: relu
    dropout: 0.2

  embedding_l1_reg: 0.0
  embedding_l2_reg: 0.0
  dense_l1_reg: 0.0
  dense_l2_reg: 0.0