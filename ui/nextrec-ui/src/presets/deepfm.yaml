# DeepFM 将 FM 的显式二阶特征交互与 MLP 的高阶非线性交互结合，三部分共享
# embedding，无需手工构造交叉特征即可端到端训练，常用于 CTR/CVR 预估。

# 流程：
#   (1) 共享 embedding 处理稀疏/序列特征，稠密特征拼接
#   (2) Wide（LR）建模一阶信号
#   (3) FM 建模二阶交互
#   (4) MLP 学习高阶非线性交互
#   (5) Wide + FM + Deep 求和后进入预测

# 主要优点：
# - 显式与隐式交互联合建模
# - 共享 embedding，减少人工交叉特征
# - 端到端训练简单，易于落地
# - CTR/CVR 任务的常用强基线

model: deepfm

params:
  mlp_params:
    hidden_dims: [256, 128]  # Deep 部分隐藏维度（高阶隐式交互）
    activation: relu         # Deep 部分激活函数
    dropout: 0.2             # Deep 部分 dropout

  embedding_l1_reg: 0.0    # embedding 参数的 L1 正则
  embedding_l2_reg: 0.0    # embedding 参数的 L2 正则
  dense_l1_reg: 0.0        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 0.0        # 线性/MLP 等 dense 参数的 L2 正则