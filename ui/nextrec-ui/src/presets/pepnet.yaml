model: pepnet

params:
  mlp_params:
    hidden_dims: [256, 128]  # 主干 MLP 隐藏维度
    activation: relu         # 主干 MLP 激活函数
    dropout: 0.1             # 主干 MLP dropout

  feature_gate_mlp_params:
    hidden_dim: 128          # 特征门控 MLP 隐藏维度（场景级特征门）
    activation: relu         # 特征门控激活函数
    dropout: 0.1             # 特征门控 dropout

  gate_mlp_params:
    hidden_dim: 64           # 任务塔层级门控 MLP 隐藏维度（PPNet gate）
    activation: relu         # 任务塔门控激活函数
    dropout: 0.1             # 任务塔门控 dropout

  domain_features: [channel]  # 场景/域特征（驱动特征门控），需要修改为实际数据中的场景/域特征字段名称
  user_features: [user_id]    # 用户特征（构建上下文向量），需要修改为实际数据中的用户特征字段名称
  item_features: [item]       # 物品特征（构建上下文向量），需要修改为实际数据中的物品特征字段名称

  embedding_l1_reg: 1.e-6     # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5     # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6         # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4         # 线性/MLP 等 dense 参数的 L2 正则
