# MaskNet 是一种用于 CTR 预估的深度排序模型，
# 主要目标是：让模型“按样本动态选择和强调有用特征”，
# 而不是对所有样本使用同一套固定的特征交互方式。
#
# 在传统的深度模型（如纯 MLP）中：
#   - 特征之间主要通过加性和非线性变换进行交互
#   - 所有样本共享同一套网络参数
#   - 难以显式区分「当前样本中哪些特征更重要」
#
# MaskNet 的核心思想是：
#   - 基于当前样本的 embedding 表示，
#   - 生成一个“实例相关（Instance-Guided）”的特征掩码（mask），
#   - 通过逐元素乘法，对不同特征维度进行动态加权，
#      放大关键信息、抑制无关或噪声特征。
#
# 这种乘法交互可以理解为：
#   - MLP 负责“生成规则”
#   - mask 负责“按样本执行规则”
#   - 相比纯加性结构，更容易建模高阶、条件化的特征关系
#
# 每个 MaskBlock 的主要计算流程包括：
#   (1) 使用当前隐藏表示，通过双层 MLP 生成 mask 向量
#       （mask 的每一维对应一个特征维度的重要性权重）
#   (2) 将 mask 与隐藏表示进行逐元素乘法，
#       实现特征级别的门控与选择
#   (3) 经过 Layer Normalization 与非线性变换，
#       稳定训练并增强表达能力
#
# 根据 MaskBlock 的组织方式，MaskNet 支持两种结构：
#   - Serial MaskNet：多个 MaskBlock 串联，逐层细化特征表示
#   - Parallel MaskNet：多个 MaskBlock 并联，从不同视角建模特征交互
#
# 主要优势：
#   - 通过乘法门控显式建模高阶特征交互，而不仅依赖加性 MLP
#   - 针对每个样本自适应调整特征维度的重要性
#   - 有效降低噪声特征对 CTR 预估的干扰
#   - 在较少特征工程的情况下提升模型表达能力与效果
#
# 注：连续特征需要先经过 embedding 层映射到高维空间，
# 再输入 MaskNet 进行处理，否则无法concat特征维度进行逐元素乘法。

model: masknet

params:
  architecture: parallel   # MaskNet 结构：serial 串行或 parallel 并行
  num_blocks: 3            # MaskBlock 数量（论文中可堆叠/并联）
  mask_hidden_dim: 64      # Instance-Guided Mask 生成器隐藏维度
  block_hidden_dim: 256    # MaskBlock 隐藏维度（FFN 输出维度）
  block_dropout: 0.2       # MaskBlock dropout
  mlp_params:
    hidden_dims: [256, 128]  
    activation: relu         
    dropout: 0.2             

  embedding_l1_reg: 1.e-6    # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5    # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4        # 线性/MLP 等 dense 参数的 L2 正则
