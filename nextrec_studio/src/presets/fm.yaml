# FM（Factorization Machine）是一种经典的 CTR 预估模型，
# 主要用于解决「特征维度极高、数据极度稀疏」场景下的特征交互建模问题。
#
# 在推荐 / 广告任务中：
#   - 大量离散特征（用户、物料、类目、上下文等）被 one-hot 后维度极高
#   - 显式构造“用户 × 物料”“人群 × 场景”等特征交叉几乎不可行
#
# FM 的核心思想是：
#   - 不直接学习每一对特征的独立权重，
#   - 而是为每个特征学习一个低维 embedding 向量，
#   - 用向量内积来刻画任意两个特征之间的二阶交互强度。
#
# 通过这种「矩阵分解式」的建模方式：
#   - 二阶交互参数规模从 O(n²) 降为 O(n·k)
#   - 可以在线性时间内计算所有特征对的交互效果
#   - 即使某些特征对在训练集中从未同时出现，也能进行合理泛化
#
# 整体计算流程如下：
#   (1) 对稀疏特征 / 序列特征进行 embedding 编码，
#       数值特征直接参与线性部分计算
#   (2) 线性部分（Wide）建模单个特征对点击率的直接影响
#   (3) 对所有 embedding 两两组合，计算二阶特征交互项（内积求和）
#   (4) 将一阶线性项与二阶交互项相加，得到最终 logit 并输出预测结果
#
# 主要优势：
#   - 以线性复杂度建模所有二阶特征交互，计算高效
#   - 对高维稀疏特征非常友好，几乎不需要人工特征交叉
#   - 参数共享能力强，对长尾特征和冷启动更稳健
#   - 结构简单、训练稳定，是 CTR 任务中最经典的基线模型之一


model: fm

params:

  embedding_l1_reg: 1.e-6  # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5  # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6      # 线性参数的 L1 正则（FM 一阶部分）
  dense_l2_reg: 1.e-4      # 线性参数的 L2 正则（FM 一阶部分）
