# Wide & Deep 同时使用宽线性部分（记忆共现/手工交叉）与深网络部分（泛化非线性交互），
# 共享特征表示，既保留记忆能力又具备泛化能力，常用于 CTR/排序任务。

# 流程：
#   (1) Wide：线性/逻辑回归建模原始或 embedding 后的特征
#   (2) Deep：embedding 与稠密特征输入 MLP
#   (3) 宽深输出求和后进入最终预测

# 主要优点：
# - 兼顾记忆与泛化
# - 支持手工交叉与自动 embedding 联合
# - 结构简单，基线性能稳定
# - 共享特征空间，减少工程开销

model: widedeep

params:
  mlp_params:
    hidden_dims: [256, 128, 64]  # Deep 分支隐藏维度
    activation: relu             # Deep 分支激活函数
    dropout: 0.2                 # Deep 分支 dropout

  embedding_l1_reg: 1.e-6        # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5        # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6            # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4            # 线性/MLP 等 dense 参数的 L2 正则
