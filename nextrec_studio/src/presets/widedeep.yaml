# Wide & Deep 是一种经典的推荐 / 排序模型结构，
# 通过同时建模「记忆能力」和「泛化能力」，解决纯线性模型或纯深度模型各自的局限。
#
# 在真实业务中常见两类信号：
#   - 高频、稳定、强规则的共现关系（如：老用户 × 熟商品）
#   - 低频、长尾、需要泛化的组合关系（如：新用户 × 新内容）
#
# Wide & Deep 将这两类信号拆分建模：
#   1. Wide（宽线性部分）：负责“记忆”
#      - 使用线性 / 逻辑回归
#      - 可直接接收原始特征或人工构造的交叉特征
#      - 擅长拟合出现频率高、规则明确的特征组合
#
#   2. Deep（深网络部分）：负责“泛化”
#      - 将稀疏特征映射为 embedding
#      - 与数值特征拼接后输入多层 MLP
#      - 自动学习高阶、非线性的特征交互模式
#
# 两个分支共享特征表示，最终联合预测，
# 既能“记住”重要的历史共现关系，又能对未见过的组合进行合理泛化。
#
# 整体计算流程如下：
#   (1) Wide 分支：对原始特征或人工交叉特征进行线性建模
#   (2) Deep 分支：对稀疏特征做 embedding，与稠密特征拼接后送入 MLP
#   (3) 将 Wide 与 Deep 两部分输出相加，得到最终预测结果
#
# 主要优势：
#   - 同时覆盖记忆型信号与泛化型信号，效果稳定
#   - 支持人工交叉特征与自动 embedding 联合使用
#   - 结构清晰、训练简单，是 CTR / 排序任务的常用基线
#   - Wide 与 Deep 共享特征空间，降低特征工程与维护成本

model: widedeep

params:
  mlp_params:
    hidden_dims: [256, 128, 64]  
    activation: relu             
    dropout: 0.2                 

  embedding_l1_reg: 1.e-6        # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5        # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6            # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4            # 线性/MLP 等 dense 参数的 L2 正则
