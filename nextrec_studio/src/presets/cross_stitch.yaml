model: cross_stitch

params:
  shared_mlp_params:
    hidden_dims: [128]   # 共享层（shared branch）隐藏维度
    activation: relu     # 共享层激活函数
    dropout: 0.1         # 共享层 dropout

  task_mlp_params:
    hidden_dims: [256, 128]  # 任务私有层隐藏维度（Cross-Stitch 之前）
    activation: relu         # 任务私有层激活函数
    dropout: 0.1             # 任务私有层 dropout

  tower_mlp_params_list:
    - hidden_dims: [64, 32]
      activation: relu       # 任务 1 塔网络激活
      dropout: 0.1           # 任务 1 塔网络 dropout
    - hidden_dims: [64, 32]
      activation: relu       # 任务 2 塔网络激活
      dropout: 0.1           # 任务 2 塔网络 dropout

  embedding_l1_reg: 1.e-6    # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5    # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4        # 线性/MLP 等 dense 参数的 L2 正则
