# Share-Bottom（硬共享底层）是多任务学习的经典基线：所有任务共享一个底层网络，
# 各任务拥有独立塔头进行细化与预测，简单高效且能通过共享正则化相关任务。

# 流程：
#   (1) 统一 embedding 处理稠密、稀疏与序列特征
#   (2) 共享底层 MLP 学习通用表示
#   (3) 任务塔在共享表示上做任务特定变换
#   (4) 各任务预测头输出对应结果

# 主要优点：
# - 硬参数共享提供强正则，减少过拟合
# - 相比单独模型更节省参数与计算
# - 易于扩展到多任务，增量开销小
# - 是评估更复杂 MTL 结构的稳健基线

model: share_bottom

params:
  bottom_mlp_params:
    hidden_dims: [256, 128]  # 共享底层 MLP 隐藏维度
    activation: relu         # 共享底层激活函数
    dropout: 0.2             # 共享底层 dropout

  tower_mlp_params_list:    # 任务塔 MLP 参数列表，按任务顺序排列，数量应与任务数一致
    - hidden_dims: [96, 48]
      activation: relu       # 任务 1 tower 激活
      dropout: 0.2           # 任务 1 tower dropout
    - hidden_dims: [128, 64]
      activation: relu       # 任务 2 tower 激活
      dropout: 0.2           # 任务 2 tower dropout

  embedding_l1_reg: 1.e-6    # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5    # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4        # 线性/MLP 等 dense 参数的 L2 正则
