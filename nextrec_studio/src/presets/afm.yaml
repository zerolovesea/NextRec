# AFM（Attentional Factorization Machine）是在 FM 基础上的改进模型，
# 核心动机是：并不是所有「特征对」的二阶交互都同样重要，
# 因此在 FM 的二阶交互上，引入注意力机制，为每个特征对自动学习一个重要性权重。
#
# 与普通 FM 相比：
#   - FM 默认所有特征对贡献相同（简单求和）
#   - AFM 会根据上下文判断「哪些特征组合更值得关注」
#
# 模型仍然保留 FM 的一阶项和 embedding 表示：
#   - 对高维稀疏特征依然友好
#   - 二阶交互具备良好的可解释性
#   - 只是在“怎么聚合二阶交互”上变得更聪明
#
# 整体计算流程如下：
#   (1) 对每个字段进行 embedding，将离散特征映射到低维连续向量
#   (2) 对所有特征对 (i, j) 计算二阶交互向量 v_i ⊙ v_j
#       （表示两个特征在 embedding 维度上的逐元素交互）
#   (3) 将每个交互向量输入注意力网络（小型 MLP，如 ReLU + 线性层），
#       输出对应的交互得分（importance score）
#   (4) 对所有交互得分做 softmax 归一化，得到各特征对的注意力权重
#   (5) 使用注意力权重对交互向量加权求和，并通过线性映射得到二阶输出
#   (6) 将二阶输出与一阶线性项相加，得到最终预测结果
#
# 主要优势：
#   - 显式学习每个特征对的重要性，提升模型可解释性
#   - 注意力机制可抑制噪声特征对，缓解无效交互带来的干扰
#   - 在保持 FM 高效性的同时，提升表达能力
#   - 参数规模可控，适合工业 CTR / CVR 场景
#
# 适用场景：
#   - 特征字段较多，但有效二阶交互相对稀疏的推荐 / 广告任务
#   - 需要一定可解释性，又不希望引入复杂 Deep 结构的场景

model: afm

params:
  attention_dim: 64          # AFM 注意力网络的隐层维度（论文中 attention MLP 的 size）
  attention_dropout: 0.1     # 注意力网络 dropout

  embedding_l1_reg: 1.e-6    # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5    # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4        # 线性/MLP 等 dense 参数的 L2 正则


