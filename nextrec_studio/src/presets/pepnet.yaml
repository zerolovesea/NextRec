# PEPNet（Parameter and Embedding Personalized Network）是一类
# 面向多场景/多用户个性化推荐的双重个性化建模方法，
# 主要目标是：
#   - 不同用户对特征的关注程度不同（需要个性化特征选择）
#   - 不同用户的决策模式不同（需要个性化模型参数）
#   - 在多场景/多域任务中，保持模型个性化能力
#
# PEPNet 的核心创新是双重个性化模块：
#
#   1. EPNet（Embedding Personalized Network）：
#      - 输入：用户个性化特征（用户ID、画像等）
#      - 输出：每个特征Field的权重标量
#      - 作用：对原始特征Embedding进行逐特征加权
#              让模型对不同用户关注不同的特征
#
#   2. PPNet（Parameter Personalized Network）：
#      - 输入：用户个性化特征
#      - 输出：主干网络MLP每层参数的偏移量 ΔW
#      - 作用：将共享参数调整为个性化参数：
#              W_personalized = W_shared + ΔW_user
#              让不同用户拥有不同的决策函数
#
# 整体计算流程：
#   (1) 从用户特征分别生成 EPNet 权重和 PPNet 参数偏移
#   (2) 用 EPNet 权重对原始特征Embedding进行缩放
#   (3) 将加权后的特征输入主干MLP（使用共享参数+PPNet偏移）
#   (4) 得到个性化预测结果
#
# 直观理解：
#   - EPNet：控制"看什么"（关注哪些特征）
#   - PPNet：控制"怎么看"（如何组合这些特征）
#   两者结合实现深度个性化
#
# 主要优势：
#   - 特征级和参数级的双重个性化，建模更精细
#   - EPNet/PPNet网络轻量，推理开销小
#   - 可插拔设计，易于集成到现有模型
#   - 有效缓解多场景数据分布差异
#
# 适用场景：
#   - 用户兴趣差异显著的多场景推荐
#   - 需要深度个性化的排序系统
#   - 多域统一模型的个性化增强

model: pepnet

params:
  mlp_params:                # 上下文编码 MLP 参数
    hidden_dims: [256, 128]  
    activation: relu         
    dropout: 0.1             

  feature_gate_mlp_params:   # 特征门控 MLP 参数
    hidden_dim: 128         
    activation: relu         
    dropout: 0.1            

  gate_mlp_params:           # 任务塔层级门控 MLP 参数
    hidden_dim: 64           
    activation: relu        
    dropout: 0.1             

  domain_features: [channel]  # 场景/域特征（驱动特征门控），需要修改为实际数据中的场景/域特征字段名称
  user_features: [user_id]    # 用户特征（构建上下文向量），需要修改为实际数据中的用户特征字段名称
  item_features: [item]       # 物品特征（构建上下文向量），需要修改为实际数据中的物品特征字段名称

  embedding_l1_reg: 1.e-6     # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5     # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6         # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4         # 线性/MLP 等 dense 参数的 L2 正则
