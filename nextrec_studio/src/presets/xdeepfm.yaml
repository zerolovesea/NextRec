# xDeepFM 是一个 CTR 预估模型，将显式与隐式的特征交互学习统一到同一框架。
# 在 DeepFM 的基础上，额外引入了 CIN（Compressed Interaction Network）
# 显式建模高阶向量级交互，同时 MLP 负责隐式非线性交互，线性部分保留一阶信号，
# 三者联合训练。

# 前向流程：
#   (1) 嵌入层：将稀疏/序列特征映射为稠密向量
#   (2) 线性部分：建模稀疏/序列特征的一阶贡献
#   (3) CIN：通过对字段嵌入做外积并卷积，显式捕获高阶交叉，可选 split-half 以控参
#   (4) 深层部分（MLP）：对所有特征进行隐式非线性交互建模
#   (5) 融合：线性、CIN、MLP 输出求和后进入任务预测层

# 主要优点：
# - 同时学习一阶、显式高阶、隐式交互
# - CIN 提供可解释的向量级交叉并可控复杂度
# - 深层分支提升非线性表达能力
# - 端到端训练降低人工特征工程需求
# - 兼容稀疏与序列特征的建模

model: xdeepfm

params:
  cin_size: [128, 128]      # CIN 各层的通道数（显式高阶交互）
  split_half: true          # CIN 是否使用 split-half 以控制参数量
  mlp_params:
    hidden_dims: [256, 128, 64]  # Deep 部分隐藏维度
    activation: relu             # Deep 部分激活函数
    dropout: 0.2                 # Deep 部分 dropout

  embedding_l1_reg: 1.e-6        # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5        # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6            # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4            # 线性/MLP 等 dense 参数的 L2 正则
