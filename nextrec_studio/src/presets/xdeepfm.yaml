# xDeepFM 是一种用于 CTR 预估的特征交互增强模型，
# 目标是在同一个统一框架中，同时学习：
#   - 单个特征本身的重要性（一阶信号）
#   - 特征之间“明确可解释”的高阶组合关系（显式交互）
#   - 多特征共同作用时的复杂非线性模式（隐式交互）
#
# 它可以看作是对 DeepFM 的一次升级：
#   - 保留线性部分，建模一阶特征贡献
#   - 保留 Deep（MLP）分支，学习隐式非线性交互
#   - 新增 CIN（Compressed Interaction Network），
#     用来显式建模高阶、向量级的特征交互
#
# CIN 的核心思想是：
#   - 以“特征字段（field）”为单位进行交互，而不是简单拼接
#   - 通过 embedding 之间的外积，显式构造高阶交叉特征
#   - 使用卷积与压缩操作控制参数规模和计算复杂度
#   - 通过多层 CIN，逐层捕获从二阶到更高阶的交互关系
#
# 整体前向计算流程如下：
#   (1) 嵌入层：将稀疏 / 序列特征映射为统一的 embedding 向量表示
#   (2) 线性部分：直接建模各特征对 CTR 的一阶线性影响
#   (3) CIN 分支：
#       - 对不同字段的 embedding 做外积，显式构造交互特征
#       - 通过卷积和压缩逐层提取高阶向量级交叉
#       - 可选 split-half 机制，在保证表达能力的同时控制参数量
#   (4) Deep 分支（MLP）：
#       - 对 embedding 拼接后的表示进行多层非线性变换
#       - 自动学习隐式、高阶、不可枚举的特征组合模式
#   (5) 融合输出：
#       - 将线性、CIN、Deep 三个分支的输出进行加权求和
#       - 输入到最终预测层，得到 CTR 预估结果
#
# 主要优势：
#   - 同时覆盖一阶、显式高阶、隐式高阶特征交互，表达能力更强
#   - CIN 显式建模向量级交叉，具有更好的可解释性
#   - split-half 机制有效控制模型规模，便于工业落地
#   - Deep 分支补充复杂非线性关系，提升泛化能力
#   - 降低人工特征交叉与特征工程成本

model: xdeepfm

params:
  cin_size: [128, 128]      # CIN 各层的通道数（显式高阶交互）
  split_half: true          # CIN 是否使用 split-half 以控制参数量
  mlp_params:
    hidden_dims: [256, 128, 64]  # Deep 部分隐藏维度
    activation: relu             # Deep 部分激活函数
    dropout: 0.2                 # Deep 部分 dropout

  embedding_l1_reg: 1.e-6        # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5        # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6            # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4            # 线性/MLP 等 dense 参数的 L2 正则
