# Date: create on 01/01/2026
# Checkpoint: edit on 17/02/2026
# Author: Yang Zhou, zyaztec@gmail.com
# Reference:
# - [1] Ma J, Zhao Z, Chen J, Li A, Hong L, Chi EH. SNR: Sub-Network Routing for Flexible Parameter Sharing in Multi-Task Learning in E-Commerce by Exploiting Task Relationships in the Label Space. Proceedings of the 33rd AAAI Conference on Artificial Intelligence (AAAI 2019), 2019, pp. 216-223.
# URL: https://ojs.aaai.org/index.php/AAAI/article/view/3788
# - [2] MMLRec-A-Unified-Multi-Task-and-Multi-Scenario-Learning-Benchmark-for-Recommendation:
# https://github.com/alipay/MMLRec-A-Unified-Multi-Task-and-Multi-Scenario-Learning-Benchmark-for-Recommendation/
#
# SNR-Trans stacks multiple expert layers and applies sparse routing with
# per-output transform matrices. Intermediate gates route expert outputs to
# the next expert stage, while the final gate routes to task towers.
#
# SNR-Trans 堆叠多层专家网络，并通过带变换矩阵的稀疏路由门控进行信息传递。
# 中间层 gate 将专家输出路由到下一层专家，最后一层 gate 将结果分配给各任务塔。

model: snr_trans

params:
  num_experts: 4            # 每层专家网络数量

  expert_mlp_params:        # 专家层 MLP 参数（按层堆叠）
    hidden_dims: [256, 128]
    activation: relu
    dropout: 0.1
    norm_type: none

  tower_mlp_params_list:    # 各任务 tower MLP 参数列表，数量需与任务数一致
    - hidden_dims: [128, 64]
      activation: relu
      dropout: 0.1
    - hidden_dims: [128, 64]
      activation: relu
      dropout: 0.1

  embedding_l1_reg: 1.e-6   # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5   # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6       # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4       # 线性/MLP 等 dense 参数的 L2 正则
