# AutoInt（AutoInt: Automatic Feature Interaction Learning via Self-Attentive Neural Networks）是一种基于自注意力机制的 CTR 预估模型，
# 目标是：在不依赖人工特征交叉的情况下，显式、高效地学习高阶特征交互关系。
#
# 在传统方法中：
#   - LR / FM 只能建模一阶或二阶交互
#   - MLP 虽然具备高阶建模能力，但交互是“隐式”的、难以解释
#
# AutoInt 的核心思想是：
#   - 将每个特征 embedding 看作一个“token”
#   - 使用多头自注意力机制，直接建模特征之间的依赖关系
#   - 注意力权重即表示“某个特征对另一个特征的重要程度”
#
# 因此，AutoInt 能做到：
#   - 显式建模高阶特征交互
#   - 自动学习哪些特征之间存在强依赖
#   - 交互路径清晰，可解释性强
#
# 模型由若干个 Interacting Layer（特征交互层）堆叠组成，
# 每一层都通过自注意力对特征 embedding 进行一次“全局交互建模”。
#
# 在单个 Interacting Layer 中，计算流程如下：
#   (1) 将每个特征 embedding 通过线性映射，投影为 Q / K / V，
#       并拆分为多个 attention head（多头注意力）
#   (2) 使用缩放点积注意力（Scaled Dot-Product Attention），
#       计算任意两个特征之间的交互权重
#   (3) 对多头注意力输出进行拼接 / 聚合，形成新的特征表示
#   (4) 使用残差连接（Residual Connection）保留原始特征信息，
#       防止深层交互带来的信息退化
#   (5) 通过 Layer Normalization 提升训练稳定性
#
# 通过堆叠多层 Interacting Layer：
#   - 第 1 层主要建模低阶 / 直接的特征交互
#   - 更深层逐步组合已有交互，形成更高阶的特征关系
#
# 由于注意力权重是显式计算的：
#   - 可以分析哪些特征之间的依赖最强
#   - 具备天然的可解释能力，优于纯 MLP 结构
#
# 主要优势：
#   - 显式、高效地建模高阶特征交互
#   - 多头注意力增强模型表达能力
#   - 残差结构支持更深的交互层堆叠
#   - 注意力权重可用于特征重要性分析
#   - 显著减少人工特征工程成本
#
# 适用场景：
#   - 特征字段较多、交互关系复杂的 CTR / CVR 预估任务
#   - 希望兼顾效果与可解释性的推荐 / 广告系统

model: autoint

params:
  att_layer_num: 3        # Interacting Layer 层数（论文中的多层自注意力交互）
  att_embedding_dim: 16   # 注意力投影维度（每个字段的 attention embedding）
  att_head_num: 2         # 多头注意力的 head 数
  att_dropout: 0.1        # 注意力层 dropout
  att_use_residual: true  # 是否启用残差连接（论文中使用残差增强稳定性）

  embedding_l1_reg: 1.e-6  # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5  # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6      # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4      # 线性/MLP 等 dense 参数的 L2 正则
