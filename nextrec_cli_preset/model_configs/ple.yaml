# PLE（Progressive Layered Extraction）是一种面向多任务学习的结构化模型，
# 主要用于解决多任务场景中「任务相关但不完全一致」时的负迁移与梯度冲突问题，
# 常见于 CTR / CVR / CTCVR 等联合建模任务。
#
# 在多任务学习中：
#   - 不同任务之间既存在共享信息（如用户兴趣）
#   - 也存在明显差异（如点击偏好 vs 转化决策）
#
# 如果简单地“完全共享底层表示”，
# 容易出现任务互相干扰、梯度方向冲突，导致整体效果下降。
#
# PLE 的核心思想是：
#   - 通过多层 CGC（Customized Gate Control）模块，
#   - 在网络的每一层逐步、可控地分离「共享信息」与「任务特有信息」，
#   - 而不是一次性强行拆分。
#
# 每一层 CGC 模块内部包含三类组件：
#   - 共享专家（Shared Experts）：学习对所有任务都有帮助的通用表示
#   - 任务专属专家（Task-specific Experts）：学习只对某个任务有用的特征
#   - 门控网络（Gates）：对不同专家的输出进行软选择和加权融合
#
# 单层 CGC 的计算流程如下：
#   (1) 共享专家与各任务专属专家对同一输入特征进行并行变换
#   (2) 每个任务门在「共享专家 + 本任务专家」上进行加权选择，
#       得到该任务在当前层的中间表示
#   (3) 共享门在「所有共享专家 + 所有任务专家」上进行汇总，
#       更新共享分支的表示
#   (4) 任务分支输出与共享分支输出作为下一层 CGC 的输入
#   (5) 通过多层堆叠，实现从“强共享”到“强区分”的逐层特征提炼
#
# 在所有 CGC 层之后：
#   - 每个任务都有独立的任务塔（Tower）
#   - 由任务塔完成最终的预测输出
#
# 这种逐层解耦的设计带来的好处是：
#   - 低层更多共享通用信息（用户、上下文等）
#   - 高层逐渐聚焦任务差异（点击 / 转化等决策差异）
#   - 共享与专属信息分离过程平滑，训练更稳定
#
# 主要优势：
#   - 通过逐层门控路由，有效缓解多任务之间的负迁移
#   - 显式区分共享专家与任务专家，提升特征解耦能力
#   - 专家数量与层数可按任务复杂度灵活配置
#   - 统一 embedding，支持稀疏、稠密及序列等多种特征
#   - 相比一次性拆分结构，梯度传播更稳定、可控
#
# 与MMOE的关键区别：
#   MMOE：所有任务共享同一组专家，通过不同门控实现差异化
#   PLE：将专家明确划分为「共享专家」和「任务专属专家」，
#        从根本上减少任务间的特征竞争，特别适用于任务差异大的场景。
#
# 为什么叫“渐进式分层提取”：
#   - 渐进式：从底层到高层，逐步分离共享与特有信息
#   - 分层：通过多个CGC层堆叠实现
#   - 提取：每层都从当前表示中“提取”出更适合该任务的特征
#
# 实际效果（基于论文实验）：
#   - 在任务相关性低的场景下，显著优于MMOE
#   - 在任务相关性高的场景下，与MMOE持平或略优
#   - 训练更稳定，收敛速度更快

model: ple

params:
  num_levels: 2             # CGC 层数（Progressive layers）
  num_specific_experts: 4   # 每个任务的专属专家数量
  num_shared_experts: 4     # 共享专家数量

  shared_expert_mlp_params:   # 共享专家 MLP 参数
    hidden_dims: [256, 128]  
    activation: relu         
    dropout: 0.1             

  specific_expert_mlp_params: # 任务专属专家 MLP 参数列表，按任务顺序排列，数量需要修改为与任务数一致
    - hidden_dims: [192, 96]
      activation: relu     
      dropout: 0.1           
    - hidden_dims: [192, 96]
      activation: relu      
      dropout: 0.1          

  tower_mlp_params_list:  # 任务塔 MLP 参数列表，按任务顺序排列，数量需要修改为与任务数一致
    - hidden_dims: [96, 48]
      activation: relu       
      dropout: 0.2           
    - hidden_dims: [128, 64]
      activation: relu       
      dropout: 0.2           

  embedding_l1_reg: 1.e-6    # embedding 参数的 L1 正则
  embedding_l2_reg: 1.e-5    # embedding 参数的 L2 正则
  dense_l1_reg: 1.e-6        # 线性/MLP 等 dense 参数的 L1 正则
  dense_l2_reg: 1.e-4        # 线性/MLP 等 dense 参数的 L2 正则
